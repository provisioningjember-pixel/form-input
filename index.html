<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Data - Vercel & Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 500px;">
        <h3 class="mb-4 text-center">Input Data Tasks</h3>

        <!-- Tempat Notifikasi Berhasil / Gagal -->
        <div id="alertBox"></div>

        <!-- Form Input -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="taskForm">
                    <div class="mb-3">
                        <label class="form-label">Nama Tugas</label>
                        <input type="text" id="namaTugas" class="form-control" placeholder="Masukkan nama tugas..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <textarea id="deskripsi" class="form-control" rows="3" placeholder="Masukkan deskripsi..." required></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn btn-primary w-100">Simpan Data</button>
                </form>
            </div>
        </div>

        <!-- Tempat Menampilkan Data -->
        <h4 class="mb-3">Daftar Tugas</h4>
        <ul id="taskList" class="list-group shadow-sm">
            <li class="list-group-item text-muted text-center">Memuat data...</li>
        </ul>
    </div>

    <!-- Firebase SDK (Version 10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase milikmu
        const firebaseConfig = {
            apiKey: "AIzaSyCIEJHWd7EBzC0FeWgtlmNF0CHpPcyCrK4",
            authDomain: "forminput-9c324.firebaseapp.com",
            projectId: "forminput-9c324",
            storageBucket: "forminput-9c324.firebasestorage.app",
            messagingSenderId: "105974451173",
            appId: "1:105974451173:web:d2976fc5ed60dad0d23d0c"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        const taskForm = document.getElementById("taskForm");
        const btnSubmit = document.getElementById("btnSubmit");
        const alertBox = document.getElementById("alertBox");

        // Fungsi Tampilkan Notifikasi
        function showAlert(message, type) {
            alertBox.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        // 1. Simpan Data ke Firebase dengan Notifikasi
        taskForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const namaTugas = document.getElementById("namaTugas").value;
            const deskripsi = document.getElementById("deskripsi").value;

            // Ubah tombol jadi loading
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Menyimpan...";

            try {
                await addDoc(tasksCollection, {
                    nama_tugas: namaTugas,
                    deskripsi: deskripsi,
                    created_at: new Date()
                });

                // Tampilkan notifikasi sukses
                showAlert("<strong>Berhasil!</strong> Data berhasil disimpan ke Firebase.", "success");
                taskForm.reset();
            } catch (error) {
                console.error("Error menambah data: ", error);
                // Tampilkan notifikasi gagal
                showAlert(`<strong>Gagal!</strong> Data tidak tersimpan: ${error.message}`, "danger");
            } finally {
                // Kembalikan tombol ke kondisi semula
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Simpan Data";
            }
        });

        // 2. Baca Data Realtime dari Firebase
        onSnapshot(tasksCollection, (snapshot) => {
            const taskList = document.getElementById("taskList");
            taskList.innerHTML = "";

            if (snapshot.empty) {
                taskList.innerHTML = `<li class="list-group-item text-muted text-center">Belum ada data tugas.</li>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = `
                    <li class="list-group-item d-flex justify-content-between align-items-start">
                        <div class="ms-2 me-auto">
                            <div class="fw-bold">${data.nama_tugas}</div>
                            <small class="text-muted">${data.deskripsi}</small>
                        </div>
                    </li>
                `;
                taskList.innerHTML += item;
            });
        }, (error) => {
            console.error("Error membaca data: ", error);
            showAlert("Gagal mengambil data dari Firebase. Cek Rules Firestore kamu!", "warning");
        });
    </script>

    <!-- JS Bootstrap untuk fitur menutup Alert -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
