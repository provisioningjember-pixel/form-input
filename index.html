<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Data - Vercel & Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 500px;">
        <h3 class="mb-4">Input Data Tasks</h3>

        <!-- Form Input -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="taskForm">
                    <div class="mb-3">
                        <label class="form-label">Nama Tugas</label>
                        <input type="text" id="namaTugas" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <textarea id="deskripsi" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Simpan Data</button>
                </form>
            </div>
        </div>

        <!-- Tempat Menampilkan Data -->
        <h4>Daftar Tugas</h4>
        <ul id="taskList" class="list-group shadow-sm"></ul>
    </div>

    <!-- Firebase SDK (Version 9 Modern Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // GANTI DENGAN KODE KONFIGURASI DARI DASHBOARD FIREBASE KAMU
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_KAMU",
            authDomain: "PASTE_AUTH_DOMAIN_KAMU",
            projectId: "PASTE_PROJECT_ID_KAMU",
            storageBucket: "PASTE_STORAGE_BUCKET_KAMU",
            messagingSenderId: "PASTE_MESSAGING_SENDER_ID_KAMU",
            appId: "PASTE_APP_ID_KAMU"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        // 1. Simpan Data ke Firebase
        document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const namaTugas = document.getElementById("namaTugas").value;
            const deskripsi = document.getElementById("deskripsi").value;

            try {
                await addDoc(tasksCollection, {
                    nama_tugas: namaTugas,
                    deskripsi: deskripsi,
                    created_at: new Date()
                });
                document.getElementById("taskForm").reset();
            } catch (error) {
                console.error("Error menambah data: ", error);
            }
        });

        // 2. Baca Data Realtime dari Firebase
        onSnapshot(tasksCollection, (snapshot) => {
            const taskList = document.getElementById("taskList");
            taskList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = `
                    <li class="list-group-item">
                        <strong>${data.nama_tugas}</strong>
                        <p class="mb-0 text-muted">${data.deskripsi}</p>
                    </li>
                `;
                taskList.innerHTML += item;
            });
        });
    </script>
</body>
</html>
